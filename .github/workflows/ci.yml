name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas_dev_password
          POSTGRES_DB: atlas_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        working-directory: apps/api
        run: pnpm prisma generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test
        env:
          DATABASE_URL: postgresql://atlas:atlas_dev_password@localhost:5432/atlas_test
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: ci_access_secret_xxxxxxxxxxxxxxxxxxxxxxxxxxx
          JWT_REFRESH_SECRET: ci_refresh_secret_xxxxxxxxxxxxxxxxxxxxxxxxx
          COOKIE_DOMAIN: localhost
          PUBLIC_BASE_URL: http://localhost:5173
          CORS_ORIGINS: http://localhost:5173
          SMTP_HOST: localhost
          SMTP_PORT: 1025
          SMTP_FROM: 'Atlas <no-reply@atlasgym.cl>'
